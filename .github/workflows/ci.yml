name: CI

on:
    push:
        branches: [main, master]
    pull_request:

jobs:
    build-test:
        # Full dev toolchain. Node 18 is not in the matrix: vitest 5 crashes on it (engines ^22.12) and
        # eslint 10 requires >= 20.19. The library itself still supports 18 — see `node18-smoke`.
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [20, 22]
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run typecheck
            - run: pnpm run lint
            - run: pnpm run test
            - run: pnpm run build

    android-validate:
        # aapt2 compile + link against a platform android.jar (link checks attribute names and values).
        runs-on: ubuntu-latest
        needs: build-test
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17
            - uses: android-actions/setup-android@v3
              with:
                  packages: 'platforms;android-35 build-tools;35.0.0'
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: node scripts/aapt2-validate.mjs
