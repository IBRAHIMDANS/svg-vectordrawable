name: Pages

# Publishes the online playground (playground/ + the lite IIFE build) to GitHub Pages.
# Requires Settings > Pages > Source: "GitHub Actions".
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions: {}

# One deployment at a time; a newer push waits instead of cancelling a deployment in progress.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - name: Smoke test the playground against the build
              run: node --test playground/smoke-test.mjs
            - name: Assemble the site
              # The page expects browser-lite.global.js next to it (see playground/README.md).
              run: |
                  mkdir _site
                  cp playground/index.html playground/style.css playground/favicon.svg _site/
                  cp playground/app.js playground/core.js playground/examples.js playground/worker.js _site/
                  cp dist/browser-lite.global.js _site/
            - uses: actions/upload-pages-artifact@v4
              with:
                  path: _site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
