name: Prepare Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version à releaser (ex: 0.2.0)'
                required: true
                type: string

jobs:
    prepare:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            actions: write # dispatch release.yml
        steps:
            # Default GITHUB_TOKEN, no personal access token. A tag pushed with it does not trigger
            # other workflows, so release.yml is dispatched explicitly at the end (workflow_dispatch is
            # one of the events GITHUB_TOKEN may trigger).
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            # Dependencies and a build are needed only to regenerate the README image below.
            - run: pnpm install --frozen-lockfile

            # `npm version` only rewrites package.json (pnpm-lock.yaml does not record the root package
            # version, so the frozen install above stays valid).
            - name: Bump version in package.json
              env:
                  VERSION: ${{ inputs.version }}
              run: npm version "${VERSION}" --no-git-tag-version

            # The README before/after image prints the version from package.json: rebuild after the
            # bump and regenerate it so it ships in the release commit. The render is deterministic,
            # so the PNG changes only when the version or the converter output does.
            - name: Regenerate the README comparison image
              run: |
                  pnpm run build
                  node docs/assets/generate-comparison.mjs

            - name: Patch CHANGELOG (Unreleased → version)
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  DATE=$(date +%Y-%m-%d)
                  sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [${VERSION}] - ${DATE}/" CHANGELOG.md

            - name: Create release branch, commit, tag and push
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git checkout -b "release/v${VERSION}"
                  git add package.json CHANGELOG.md docs/assets/radial-gradient-comparison.png
                  git commit -m "chore(release): bump version to ${VERSION}"
                  git tag "v${VERSION}"
                  git push origin "release/v${VERSION}"
                  git push origin "v${VERSION}"

            # Publish first: run release.yml on the tag. It is a new top-level run of release.yml, the
            # workflow registered as npm Trusted Publisher.
            - name: Dispatch the release workflow on the tag
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ inputs.version }}
              run: gh workflow run release.yml --ref "v${VERSION}"

            # Needs "Allow GitHub Actions to create and approve pull requests" (Settings > Actions >
            # General). When it is off, print the link instead of failing: the release is already out.
            - name: Open PR into main
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ inputs.version }}
              run: |
                  if ! gh pr create \
                    --title "chore(release): bump version to ${VERSION}" \
                    --body "Préparation automatique de la release v${VERSION}. Le tag a déclenché la publication npm ; merger pour intégrer le bump dans main." \
                    --base main \
                    --head "release/v${VERSION}"; then
                    echo "::warning::Could not open the PR (Actions may not create pull requests here). Open it manually: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...release/v${VERSION}"
                  fi
