<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <!-- Reduced from web-platform-tests/wpt svg/struct/reftests/use-symbol-inline-css-002.svg at commit 76f5455a0a266f098dd8bd888a8a84b0cad0350d.
       Copyright (c) web-platform-tests contributors. 3-Clause BSD License:
       https://github.com/web-platform-tests/wpt/blob/master/LICENSE.md
       Defect: width/height on a <use> referencing a <symbol> without viewBox are ignored: the symbol
       content is not clipped to the 100x100 viewport (expected: green 100x100 square). -->
  <defs>
    <symbol id="sym">
      <rect width="400" height="400" fill="green"/>
    </symbol>
  </defs>
  <use href="#sym" width="100" height="100"/>
</svg>
